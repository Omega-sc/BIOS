[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-incident-investigation"
version = "0.1.0"
description = "Autonomous Incident Investigation for Track 09"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "networkx>=3.0",
    "scipy>=1.12.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pytest>=8.0",
    "ruff>=0.4.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
